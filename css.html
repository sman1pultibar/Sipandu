<style>
/* ==============================================================================
 * SIPANDU - CSS STYLING & PRINT ENGINE
 * FILOSOFI: Anti-AI Human-Crafted Aesthetic (Deep Navy & Slate)
 * DUKUNGAN CETAK: Presisi Ukuran Kertas F4/Folio (215x330mm) & A4 (210x297mm)
 * ============================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

:root {
  --primary-950: #020617;
  --primary-900: #0f172a;
  --primary-800: #1e293b;
  --primary-700: #334155;
  --primary-600: #475569;
  --primary-500: #64748b;
  
  --accent-600: #4338ca;
  --accent-500: #4f46e5;
  --accent-100: #e0e7ff;
  --accent-50: #eef2ff;
  
  --emerald-600: #059669;
  --emerald-500: #10b981;
  --emerald-50: #ecfdf5;
  
  --amber-600: #d97706;
  --amber-500: #f59e0b;
  --amber-50: #fffbeb;
  
  --rose-600: #e11d48;
  --rose-500: #f43f5e;
  --rose-50: #fff1f2;
  
  --surface-bg: #f8fafc;
  --surface-card: #ffffff;
  --border-color: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  
  --sidebar-w: 270px;
  --topbar-h: 68px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
  --shadow-float: 0 20px 25px -5px rgba(15,23,42,0.12), 0 8px 10px -6px rgba(15,23,42,0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  background-color: var(--surface-bg);
  color: var(--text-main);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ==============================================================================
 * 1. HALAMAN LOGIN DEPAN
 * ============================================================================== */
.login-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top right, #1e293b, #0f172a 70%);
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: #ffffff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-float);
  padding: 40px 32px;
  border: 1px solid rgba(255,255,255,0.2);
}

.login-header {
  text-align: center;
  margin-bottom: 28px;
}

.login-logo {
  width: 90px;
  height: 90px;
  object-fit: contain;
  margin: 0 auto 16px;
  display: block;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
}

.login-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--primary-900);
  letter-spacing: -0.5px;
}

.login-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary-800);
  margin-bottom: 6px;
}

.input-container {
  position: relative;
  display: flex;
  align-items: center;
}

.form-input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--text-main);
  background: #fff;
  transition: all 0.2s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--accent-500);
  box-shadow: 0 0 0 3px var(--accent-100);
}

.input-with-icon {
  padding-right: 44px;
}

.icon-eye-btn {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--primary-500);
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.icon-eye-btn:hover {
  color: var(--primary-900);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid transparent;
  text-decoration: none;
}

.btn-primary {
  background-color: var(--accent-500);
  color: #fff;
}

.btn-primary:hover {
  background-color: var(--accent-600);
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
}

.btn-secondary {
  background-color: #fff;
  border-color: var(--border-color);
  color: var(--primary-700);
}

.btn-secondary:hover {
  background-color: var(--surface-bg);
  border-color: var(--primary-500);
}

.btn-success {
  background-color: var(--emerald-500);
  color: #fff;
}

.btn-success:hover {
  background-color: var(--emerald-600);
}

.btn-danger {
  background-color: var(--rose-500);
  color: #fff;
}

.btn-danger:hover {
  background-color: var(--rose-600);
}

.btn-block {
  width: 100%;
  height: 46px;
}

/* ==============================================================================
 * 2. LAYOUT DASHBOARD UTAMA
 * ============================================================================== */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* Sidebar Navigasi */
.app-sidebar {
  width: var(--sidebar-w);
  background-color: var(--primary-900);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 4px 0 15px rgba(0,0,0,0.1);
}

.sidebar-header {
  height: var(--topbar-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-brand-logo {
  width: 36px;
  height: 36px;
  object-fit: contain;
}

.sidebar-brand-text {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
  color: #fff;
}

.sidebar-menu {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.menu-category {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary-500);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 12px 10px 4px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  color: #cbd5e1;
  text-decoration: none;
  font-weight: 500;
  font-size: 13.5px;
  transition: all 0.2s ease;
  cursor: pointer;
}

.menu-item:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
}

.menu-item.active {
  background: var(--accent-500);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
}

.menu-item svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.user-profile-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.04);
}

.user-avatar-circle {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--accent-500);
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.user-info {
  flex: 1;
  overflow: hidden;
}

.user-name {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}

.user-role {
  font-size: 11px;
  color: var(--primary-500);
}

/* Area Konten Utama */
.main-wrapper {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-topbar {
  height: var(--topbar-h);
  background: #fff;
  border-bottom: 1px solid var(--border-color);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.mobile-toggle-btn {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--primary-700);
}

.page-heading-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary-900);
  letter-spacing: -0.3px;
}

.content-body {
  padding: 28px;
  flex: 1;
}

/* ==============================================================================
 * 3. KARTU METRIK & GRID AKSI CEPAT
 * ============================================================================== */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}

.metric-card {
  background: var(--surface-card);
  padding: 22px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 18px;
  transition: transform 0.2s, box-shadow 0.2s;
}

.metric-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.metric-icon-box {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.metric-blue { background: #e0e7ff; color: #4338ca; }
.metric-emerald { background: #d1fae5; color: #059669; }
.metric-amber { background: #fef3c7; color: #d97706; }
.metric-rose { background: #ffe4e6; color: #e11d48; }

.metric-val {
  font-size: 26px;
  font-weight: 800;
  color: var(--primary-900);
  line-height: 1.2;
}

.metric-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
}

.info-banner {
  background: linear-gradient(135deg, var(--primary-900), var(--primary-800));
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 28px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.info-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 6px;
}

.info-desc {
  font-size: 13.5px;
  color: #cbd5e1;
}

.section-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary-900);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.quick-action-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.action-card {
  background: var(--surface-card);
  padding: 18px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--primary-800);
  text-decoration: none;
}

.action-card:hover {
  border-color: var(--accent-500);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  color: var(--accent-600);
}

.action-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--surface-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary-700);
  transition: all 0.2s;
}

.action-card:hover .action-icon {
  background: var(--accent-100);
  color: var(--accent-600);
}

.action-title {
  font-size: 13px;
  font-weight: 600;
}

/* ==============================================================================
 * 4. TABEL RESPODIF & FORM PENGATURAN
 * ============================================================================== */
.card {
  background: var(--surface-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  padding: 24px;
  margin-bottom: 24px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.table-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.search-input {
  width: 240px;
  height: 38px;
  padding: 0 12px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 13px;
}

.select-filter {
  height: 38px;
  padding: 0 12px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 13px;
  background-color: #fff;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

.data-table th {
  background-color: #f1f5f9;
  color: var(--primary-800);
  font-weight: 700;
  padding: 12px 16px;
  border-bottom: 2px solid var(--border-color);
  white-space: nowrap;
}

.data-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: middle;
  color: var(--primary-900);
}

.data-table tr:hover {
  background-color: #f8fafc;
}

.table-photo-thumb {
  width: 38px;
  height: 48px;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #eee;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 9999px;
  font-size: 11.5px;
  font-weight: 600;
}

.badge-blue { background: #e0e7ff; color: #4338ca; }
.badge-green { background: #d1fae5; color: #065f46; }
.badge-gray { background: #f1f5f9; color: #475569; }

/* Pagination Controls */
.pagination-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 4px 4px;
  flex-wrap: wrap;
  gap: 12px;
}

.pagination-info {
  font-size: 13px;
  color: var(--text-muted);
}

.pagination-pages {
  display: flex;
  align-items: center;
  gap: 6px;
}

.page-btn {
  height: 34px;
  min-width: 34px;
  padding: 0 8px;
  border: 1px solid var(--border-color);
  background: #fff;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.page-btn:hover:not(:disabled) {
  border-color: var(--accent-500);
  color: var(--accent-600);
}

.page-btn.active {
  background: var(--accent-500);
  border-color: var(--accent-500);
  color: #fff;
}

.page-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Kop Surat Live Preview */
.kop-surat-preview-box {
  border: 1.5px dashed var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 3px double #0f172a;
  margin-top: 10px;
}

.kop-logo {
  width: 70px;
  height: 70px;
  object-fit: contain;
}

.kop-center-text {
  flex: 1;
  text-align: center;
}

.kop-line-1 { font-size: 13px; font-weight: 600; text-transform: uppercase; }
.kop-line-2 { font-size: 16px; font-weight: 800; text-transform: uppercase; color: var(--primary-900); }
.kop-line-3 { font-size: 12px; color: var(--primary-600); margin-top: 2px; }

/* ==============================================================================
 * 5. MODAL BOX & DIALOG CUSTOM ANTI-GOOGLE EMBED
 * ============================================================================== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
  animation: fadeIn 0.2s ease-out;
}

.modal-dialog {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-float);
  width: 100%;
  max-width: 520px;
  overflow: hidden;
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary-900);
}

.modal-close-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--primary-500);
  font-size: 20px;
}

.modal-body {
  padding: 24px;
  max-height: 75vh;
  overflow-y: auto;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  background: #f8fafc;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  min-width: 300px;
  max-width: 420px;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  color: #fff;
  font-size: 13.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideInRight 0.3s ease;
}

.toast-success { background: var(--emerald-600); }
.toast-error { background: var(--rose-600); }
.toast-info { background: var(--primary-900); }

/* ==============================================================================
 * 6. CSS PRINT ENGINE (STANDAR RESMI F4 & A4) - ISOLASI TOTAL ANTI-BERANTAKAN
 * ============================================================================== */
.print-container {
  display: none;
}

@media print {
  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: auto !important;
  }

  /* Sembunyikan SELURUH elemen antarmuka Web App saat cetak fisik / PDF */
  #appView,
  #loginView,
  .app-container,
  .app-sidebar,
  .app-topbar,
  .main-wrapper,
  .content-body,
  .page-section,
  .card,
  .preview-wrapper,
  #livePrintPreviewContainer,
  .no-print,
  .metric-grid,
  .info-banner,
  .quick-action-grid,
  .card-header,
  .pagination-wrapper,
  .modal-overlay,
  .toast-container {
    display: none !important;
    visibility: hidden !important;
  }

  /* HANYA tampilkan kontainer dokumen cetak resmi */
  .print-container,
  #printContainer {
    display: block !important;
    visibility: visible !important;
    position: relative !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #ffffff !important;
  }

  .page-break {
    page-break-after: always !important;
    break-after: page !important;
  }

  .no-break {
    page-break-inside: avoid !important;
    break-inside: avoid !important;
  }

  /* Universal Print Container Visibility */
  .grid-kartu-peserta-6,
  .grid-nomor-meja-12,
  .grid-kartu-panitia-6,
  .dokumen-resmi-wrapper,
  .denah-print-wrapper {
    width: 100% !important;
    box-sizing: border-box !important;
  }
}

/* ==============================================================================
 * 6B. STYLING DOKUMEN CETAK RESMI (BERLAKU UNTUK LIVE PREVIEW & @MEDIA PRINT)
 * ============================================================================== */
.doc-notice-banner {
  background: #fef9c3;
  border: 1px solid #fef08a;
  color: #854d0e;
  font-size: 11px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.doc-notice-banner.notice-blue {
  background: #eff6ff;
  border-color: #bfdbfe;
  color: #1e40af;
}

/* 1. Kartu Peserta Ujian: 6 Kartu Simetris per Lembar A4 (6.5cm x 9.5cm) */
