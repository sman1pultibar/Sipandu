<script>
/**
 * ==============================================================================
 * SIPANDU - FRONTEND ENGINE & CLIENT-SIDE CACHE
 * STANDAR: ZettBOT Architecture (Zero-Lag Navigation, Anti-Nested Backticks)
 * ==============================================================================
 */

// State Global & In-Memory Client Cache
const APP_STATE = {
  currentUser: null,
  activePage: 'dashboard',
  paperSize: 'f4',
  printOptions: {
    ttdStempel: false,
    ttdImage: '',
    tampilkanFoto: false,
    denahLayout: 'spiral',
    denahStart: 'kiri',
    denahPengawas: 'kanan'
  },
  cache: {
    dashboard: null,
    settings: null,
    students: {}, // key: page_search_kelas
    panitia: null,
    pengawas: null,
    distribusi: null
  },
  currentStudentPage: 1,
  currentStudentLimit: 15,
  searchTimer: null,
  excelTarget: 'siswa',
  parsedExcelData: null
};

// ==============================================================================
// MODAL DIALOG ENGINE KUSTOM (ANTI-EMBED POPUP BROWSER)
// ==============================================================================
let activeConfirmCallback = null;

function showConfirmDialog(config) {
  // config: { title, message, confirmText, confirmType, onConfirm }
  const modal = document.getElementById('universalConfirmModal');
  if (!modal) return;
  
  document.getElementById('confirmModalTitle').textContent = config.title || 'Konfirmasi Tindakan';
  document.getElementById('confirmModalMessage').innerHTML = config.message || 'Apakah Anda yakin ingin melanjutkan tindakan ini?';
  
  const submitBtn = document.getElementById('confirmModalSubmitBtn');
  submitBtn.textContent = config.confirmText || 'Ya, Lanjutkan';
  
  const type = config.confirmType || 'danger'; // 'danger' | 'primary' | 'warning'
  submitBtn.className = 'btn btn-' + (type === 'primary' ? 'primary' : (type === 'warning' ? 'secondary' : 'danger'));
  
  const iconBox = document.getElementById('confirmModalIconBox');
  const iconDanger = document.getElementById('confirmModalIconDanger');
  const iconPrimary = document.getElementById('confirmModalIconPrimary');
  const iconWarning = document.getElementById('confirmModalIconWarning');
  
  iconDanger.style.display = 'none';
  iconPrimary.style.display = 'none';
  iconWarning.style.display = 'none';
  
  if (type === 'primary') {
    iconBox.style.background = '#eef2ff';
    iconBox.style.color = 'var(--accent-600)';
    iconPrimary.style.display = 'block';
  } else if (type === 'warning') {
    iconBox.style.background = '#fef3c7';
    iconBox.style.color = '#d97706';
    iconWarning.style.display = 'block';
  } else {
    iconBox.style.background = '#ffe4e6';
    iconBox.style.color = 'var(--rose-600)';
    iconDanger.style.display = 'block';
  }
  
  activeConfirmCallback = config.onConfirm;
  openModal('universalConfirmModal');
}

function closeConfirmDialog() {
  activeConfirmCallback = null;
  closeModal('universalConfirmModal');
}

function openEditKursiModal(idDist, oldRuang, oldMeja) {
  document.getElementById('promptDistId').value = idDist || '';
  document.getElementById('promptNamaRuang').value = oldRuang || '';
  document.getElementById('promptNoMeja').value = oldMeja || 1;
  openModal('customPromptModal');
}

function handleCustomPromptSubmit(event) {
  event.preventDefault();
  const idDist = document.getElementById('promptDistId').value;
  const newRuang = document.getElementById('promptNamaRuang').value.trim();
  const newMeja = parseInt(document.getElementById('promptNoMeja').value, 10) || 1;
  
  if (!newRuang) {
    showToast('Nama ruang ujian wajib diisi.', 'error');
    return;
  }
  
  closeModal('customPromptModal');
  showToast('Memperbarui penataan kursi...', 'info');
  
  callBackend('updateDistribusiKursi', {
    idDistribusi: idDist,
    namaRuang: newRuang,
    noMeja: newMeja
  }, function(res) {
    if (res && res.success) {
      showToast(res.message, 'success');
      fetchDistribusiData();
    } else {
      showToast('Gagal mengubah posisi kursi.', 'error');
    }
  });
}

// ==============================================================================
// 1. INISIALISASI & NAVIGASI HALAMAN
// ==============================================================================
document.addEventListener('DOMContentLoaded', function() {
  // Pasang listener tombol konfirmasi universal
  const confBtn = document.getElementById('confirmModalSubmitBtn');
  if (confBtn) {
    confBtn.onclick = function() {
      const cb = activeConfirmCallback;
      closeConfirmDialog();
      if (typeof cb === 'function') {
        cb();
      }
    };
  }

  // Cek apakah ada sesi login tersimpan
  const savedUser = sessionStorage.getItem('sipandu_user');
  if (savedUser) {
    try {
      APP_STATE.currentUser = JSON.parse(savedUser);
      enterApp();
    } catch (e) {
      showLogin();
    }
  } else {
    showLogin();
  }
});

function showLogin() {
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('appView').style.display = 'none';
}

function enterApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'flex';
  
  if (APP_STATE.currentUser) {
    document.getElementById('userFullName').textContent = APP_STATE.currentUser.namaLengkap || 'Administrator';
    document.getElementById('userAvatarText').textContent = (APP_STATE.currentUser.namaLengkap || 'A').charAt(0).toUpperCase();
  }
  
  // Muat data awal (Dashboard & Pengaturan)
  loadSettingsData();
  navigateTo('dashboard');
}

function navigateTo(pageId, menuElem) {
  APP_STATE.activePage = pageId;
  
  // Update styling menu aktif
  const menuItems = document.querySelectorAll('.sidebar-menu .menu-item');
  menuItems.forEach(function(item) { item.classList.remove('active'); });
  if (menuElem) {
    menuElem.classList.add('active');
  }
  
  // Sembunyikan seluruh section halaman
  const sections = document.querySelectorAll('.page-section');
  sections.forEach(function(sec) { sec.style.display = 'none'; });
  
  // Tampilkan section target
  const targetSection = document.getElementById('section-' + pageId);
  if (targetSection) {
    targetSection.style.display = 'block';
  }
  
  // Update Judul Topbar
  const titles = {
    dashboard: 'Dashboard Utama',
    pengaturan: 'Pengaturan Ujian & Identitas',
    siswa: 'Master Data Siswa',
    panitia: 'Master Data Panitia',
    pengawas: 'Master Data Pengawas Ruang',
    ruang: 'Pembagian Ruang Ujian',
    cetak: 'Pusat Cetak Administrasi Ujian',
    backup: 'Pencadangan & Pemulihan (JSON)',
    password: 'Ganti Kata Sandi Admin'
  };
  document.getElementById('pageTitle').textContent = titles[pageId] || 'Sipandu';
  
  // Tutup sidebar mobile jika sedang terbuka
  closeMobileSidebar();
  
  // Muat data sesuai menu (dengan Cache In-Memory)
  if (pageId === 'dashboard') loadDashboardData();
  else if (pageId === 'pengaturan') renderSettingsForm();
  else if (pageId === 'siswa') fetchStudentsData(1);
  else if (pageId === 'panitia') loadPanitiaData();
  else if (pageId === 'pengawas') loadPengawasData();
  else if (pageId === 'ruang') fetchDistribusiData();
  else if (pageId === 'cetak') loadCetakOptions();
}

function toggleMobileSidebar() {
  const sidebar = document.getElementById('appSidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  sidebar.classList.toggle('show');
  backdrop.classList.toggle('show');
}

function closeMobileSidebar() {
  const sidebar = document.getElementById('appSidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  if (sidebar) sidebar.classList.remove('show');
  if (backdrop) backdrop.classList.remove('show');
}

function refreshCurrentData() {
  // Kosongkan cache untuk menu yang aktif dan reload
  if (APP_STATE.activePage === 'dashboard') {
    APP_STATE.cache.dashboard = null;
    loadDashboardData();
  } else if (APP_STATE.activePage === 'pengaturan') {
    APP_STATE.cache.settings = null;
    loadSettingsData(true);
  } else if (APP_STATE.activePage === 'siswa') {
    APP_STATE.cache.students = {};
    fetchStudentsData(APP_STATE.currentStudentPage);
  } else if (APP_STATE.activePage === 'panitia') {
    APP_STATE.cache.panitia = null;
    loadPanitiaData();
  } else if (APP_STATE.activePage === 'pengawas') {
    APP_STATE.cache.pengawas = null;
    loadPengawasData();
  } else if (APP_STATE.activePage === 'ruang') {
    APP_STATE.cache.distribusi = null;
    fetchDistribusiData();
  }
  showToast('Data berhasil disegarkan dari server.', 'info');
}

// ==============================================================================
// 2. AUTENTIKASI, TOGGLE PASSWORD & LOGOUT KUSTOM
// ==============================================================================
function togglePasswordVisibility(inputId, eyeIconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(eyeIconId);
  if (!input) return;
  
  if (input.type === 'password') {
    input.type = 'text';
    if (icon) {
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    }
  } else {
    input.type = 'password';
    if (icon) {
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
  }
}

function handleLoginSubmit(event) {
  event.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginSubmitBtn');
  
  if (!username || !password) {
    showToast('Silakan isi username dan password.', 'error');
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span>Memverifikasi...</span>';
  
  callBackend('login', { username: username, password: password }, function(res) {
    btn.disabled = false;
    btn.innerHTML = '<span>Masuk ke Sistem</span>';
    
    if (res && res.success) {
      APP_STATE.currentUser = res.user;
      sessionStorage.setItem('sipandu_user', JSON.stringify(res.user));
      showToast('Selamat datang, ' + res.user.namaLengkap, 'success');
      enterApp();
    } else {
      showToast((res && res.message) ? res.message : 'Login gagal.', 'error');
    }
  });
}

function showLogoutModal() {
  openModal('logoutModal');
}

function executeLogout() {
  closeModal('logoutModal');
  APP_STATE.currentUser = null;
  sessionStorage.removeItem('sipandu_user');
  APP_STATE.cache = { dashboard: null, settings: null, students: {}, panitia: null, pengawas: null, distribusi: null };
  document.getElementById('loginPassword').value = '';
  showLogin();
  showToast('Anda telah berhasil keluar dari sistem.', 'info');
}

function handleChangePasswordSubmit(event) {
  event.preventDefault();
  const oldPass = document.getElementById('oldPassword').value;
  const newPass = document.getElementById('newPassword').value;
  const confPass = document.getElementById('confirmPassword').value;
  
  if (newPass !== confPass) {
    showToast('Konfirmasi kata sandi baru tidak cocok.', 'error');
    return;
  }
  
  callBackend('changePassword', {
    username: APP_STATE.currentUser.username,
    oldPassword: oldPass,
    newPassword: newPass
  }, function(res) {
    if (res && res.success) {
      showToast(res.message, 'success');
      document.getElementById('oldPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
    } else {
      showToast((res && res.message) ? res.message : 'Gagal memperbarui password.', 'error');
    }
  });
}

// ==============================================================================
// 3. DASHBOARD METRIK & QUICK PRINT
// ==============================================================================
function loadDashboardData() {
  if (APP_STATE.cache.dashboard) {
    renderDashboardUI(APP_STATE.cache.dashboard);
    return;
  }
  
  callBackend('getDashboard', null, function(res) {
    if (res && res.success) {
      APP_STATE.cache.dashboard = res;
      renderDashboardUI(res);
    }
  });
}

function renderDashboardUI(data) {
  const stats = data.stats || {};
  document.getElementById('dashTotalSiswa').textContent = stats.totalSiswa || 0;
  document.getElementById('dashTotalRuang').textContent = stats.totalRuang || 0;
  document.getElementById('dashTotalPanitia').textContent = stats.totalPanitia || 0;
  document.getElementById('dashTotalPengawas').textContent = stats.totalPengawas || 0;
  
  const set = data.settings || {};
  if (set.NamaUjian) document.getElementById('dashBannerNamaUjian').textContent = set.NamaUjian;
  const infoText = 'Tahun Ajaran ' + (set.TahunAjaran || '-') + ' • Semester ' + (set.Semester || '-') + ' • ' + (set.NamaSekolah || '-');
  document.getElementById('dashBannerInfoDetail').textContent = infoText;
}

function quickPrint(jenis) {
  navigateTo('cetak');
  document.getElementById('cetakJenisDokumen').value = jenis;
  handleDokumenTypeChange();
}

// ==============================================================================
// 4. PENGATURAN IDENTITAS SEKOLAH & LIVE KOP SURAT
// ==============================================================================
function loadSettingsData(forceRender) {
  if (APP_STATE.cache.settings && !forceRender) {
    return;
  }
  callBackend('getSettings', null, function(res) {
    if (res && res.success) {
      APP_STATE.cache.settings = res.settings;
      renderSettingsForm();
    }
  });
}

function renderSettingsForm() {
  const s = APP_STATE.cache.settings || {};
  if (!s.NamaSekolah) {
    loadSettingsData(true);
    return;
  }
  
  if (document.getElementById('cfgHeaderKop1')) document.getElementById('cfgHeaderKop1').value = s.HeaderKop1 || 'PEMERINTAH PROVINSI / DAERAH';
  if (document.getElementById('cfgHeaderKop2')) document.getElementById('cfgHeaderKop2').value = s.HeaderKop2 || 'DINAS PENDIDIKAN DAN KEBUDAYAAN';
  document.getElementById('cfgNamaSekolah').value = s.NamaSekolah || '';
  document.getElementById('cfgTahunAjaran').value = s.TahunAjaran || '';
  document.getElementById('cfgSemester').value = s.Semester || 'Genap';
  document.getElementById('cfgNamaUjian').value = s.NamaUjian || '';
  document.getElementById('cfgKapasitasRuang').value = s.KapasitasRuang || 20;
  document.getElementById('cfgPrefixNoPeserta').value = s.PrefixNoPeserta || 'UJN-2026-';
  document.getElementById('cfgSistemSesi').value = s.SistemSesi || 'Tunggal';
  document.getElementById('cfgTempatTanggal').value = s.TempatTanggal || '';
  document.getElementById('cfgKepalaSekolah').value = s.KepalaSekolah || '';
  document.getElementById('cfgNipKepalaSekolah').value = s.NipKepalaSekolah || '';
  document.getElementById('cfgKetuaPanitia').value = s.KetuaPanitia || '';
  document.getElementById('cfgNipKetuaPanitia').value = s.NipKetuaPanitia || '';
  document.getElementById('cfgLogoDinas').value = s.LogoDinas || '';
  document.getElementById('cfgLogoSekolah').value = s.LogoSekolah || '';
  
  updateKopPreview();
}

function updateKopPreview() {
  const h1 = document.getElementById('cfgHeaderKop1') ? (document.getElementById('cfgHeaderKop1').value || 'PEMERINTAH PROVINSI / DAERAH') : 'PEMERINTAH PROVINSI / DAERAH';
  const h2 = document.getElementById('cfgHeaderKop2') ? (document.getElementById('cfgHeaderKop2').value || 'DINAS PENDIDIKAN DAN KEBUDAYAAN') : 'DINAS PENDIDIKAN DAN KEBUDAYAAN';
  const namaSekolah = document.getElementById('cfgNamaSekolah').value || 'NAMA SEKOLAH ANDA';
  const namaUjian = document.getElementById('cfgNamaUjian').value || 'ASESMEN AKHIR SEMESTER';
  const thnAjar = document.getElementById('cfgTahunAjaran').value || '2026/2027';
  const smt = document.getElementById('cfgSemester').value || 'Genap';
  const logoDinas = document.getElementById('cfgLogoDinas').value;
  const logoSekolah = document.getElementById('cfgLogoSekolah').value;
  
  if (document.getElementById('prevKopHeader1')) document.getElementById('prevKopHeader1').textContent = h1.toUpperCase();
  if (document.getElementById('prevKopHeader2')) document.getElementById('prevKopHeader2').textContent = h2.toUpperCase();
  document.getElementById('prevKopNamaSekolah').textContent = namaSekolah.toUpperCase();
  document.getElementById('prevKopNamaUjian').textContent = namaUjian.toUpperCase() + ' • SEMESTER ' + smt.toUpperCase() + ' T.A. ' + thnAjar;
  
  if (logoDinas) document.getElementById('prevKopLogoDinas').src = formatLh3(logoDinas);
  if (logoSekolah) document.getElementById('prevKopLogoSekolah').src = formatLh3(logoSekolah);
}

function handleSaveSettings(event) {
  event.preventDefault();
  const payload = {
    HeaderKop1: document.getElementById('cfgHeaderKop1') ? document.getElementById('cfgHeaderKop1').value : 'PEMERINTAH PROVINSI / DAERAH',
    HeaderKop2: document.getElementById('cfgHeaderKop2') ? document.getElementById('cfgHeaderKop2').value : 'DINAS PENDIDIKAN DAN KEBUDAYAAN',
    NamaSekolah: document.getElementById('cfgNamaSekolah').value,
    TahunAjaran: document.getElementById('cfgTahunAjaran').value,
    Semester: document.getElementById('cfgSemester').value,
    NamaUjian: document.getElementById('cfgNamaUjian').value,
    KapasitasRuang: parseInt(document.getElementById('cfgKapasitasRuang').value, 10) || 20,
    PrefixNoPeserta: document.getElementById('cfgPrefixNoPeserta').value,
    SistemSesi: document.getElementById('cfgSistemSesi').value,
    TempatTanggal: document.getElementById('cfgTempatTanggal').value,
    KepalaSekolah: document.getElementById('cfgKepalaSekolah').value,
    NipKepalaSekolah: document.getElementById('cfgNipKepalaSekolah').value,
    KetuaPanitia: document.getElementById('cfgKetuaPanitia').value,
    NipKetuaPanitia: document.getElementById('cfgNipKetuaPanitia').value,
    LogoDinas: document.getElementById('cfgLogoDinas').value,
    LogoSekolah: document.getElementById('cfgLogoSekolah').value
  };
  
  callBackend('saveSettings', payload, function(res) {
    if (res && res.success) {
      APP_STATE.cache.settings = payload;
      APP_STATE.cache.dashboard = null; // reset cache dashboard agar refresh
      showToast('Pengaturan ujian berhasil disimpan.', 'success');
      updateKopPreview();
    } else {
      showToast((res && res.message) ? res.message : 'Gagal menyimpan pengaturan.', 'error');
    }
  });
}

// ==============================================================================
// 5. MASTER DATA SISWA (SEARCH DEBOUNCE, PAGINATION & CRUD)
// ==============================================================================
function debounceSearchSiswa() {
  clearTimeout(APP_STATE.searchTimer);
  APP_STATE.searchTimer = setTimeout(function() {
    fetchStudentsData(1);
  }, 350);
}

function fetchStudentsData(page) {
  APP_STATE.currentStudentPage = page || 1;
  const searchVal = document.getElementById('searchSiswa').value.trim();
  const kelasVal = document.getElementById('filterKelasSiswa').value;
  const cacheKey = 'p' + APP_STATE.currentStudentPage + '_s' + searchVal + '_k' + kelasVal;
  
  if (APP_STATE.cache.students[cacheKey]) {
    renderStudentsTable(APP_STATE.cache.students[cacheKey]);
    return;
  }
  
  const payload = {
    page: APP_STATE.currentStudentPage,
    limit: APP_STATE.currentStudentLimit,
    search: searchVal,
    kelas: kelasVal
  };
  
  callBackend('getStudents', payload, function(res) {
    if (res && res.success) {
      APP_STATE.cache.students[cacheKey] = res;
      renderStudentsTable(res);
      updateClassFilterOptions(res.classes);
    }
  });
}

function updateClassFilterOptions(classes) {
  const select = document.getElementById('filterKelasSiswa');
  const currentVal = select.value;
  let html = '<option value="">Semua Kelas</option>';
  if (classes && classes.length) {
    classes.forEach(function(c) {
      const selected = (c === currentVal) ? ' selected' : '';
      html += '<option value="' + escapeHtml(c) + '"' + selected + '>' + escapeHtml(c) + '</option>';
    });
  }
  select.innerHTML = html;
}

function renderStudentsTable(data) {
  const tbody = document.getElementById('siswaTableBody');
  const items = data.data || [];
  
  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 24px; color: var(--text-muted);">Tidak ada data siswa ditemukan.</td></tr>';
    document.getElementById('siswaPaginationInfo').textContent = 'Menampilkan 0 dari 0 siswa';
    document.getElementById('siswaPaginationBtns').innerHTML = '';
    return;
  }
  
  let rowsHtml = '';
  items.forEach(function(s) {
    rowsHtml += '<tr>';
    rowsHtml += '<td><img src="' + formatLh3(s.fotoUrl) + '" class="table-photo-thumb" alt="Foto"></td>';
    rowsHtml += '<td><span class="badge badge-blue">' + escapeHtml(s.noPeserta || '-') + '</span></td>';
    rowsHtml += '<td><strong>' + escapeHtml(s.nisn || '-') + '</strong><br><span style="color:var(--text-muted); font-size:11.5px;">' + escapeHtml(s.nis || '') + '</span></td>';
    rowsHtml += '<td><strong style="color:var(--primary-900);">' + escapeHtml(s.namaSiswa) + '</strong></td>';
    rowsHtml += '<td><span class="badge badge-green">' + escapeHtml(s.kelas) + '</span></td>';
    rowsHtml += '<td>' + escapeHtml(s.jenisKelamin || '-') + '</td>';
    rowsHtml += '<td style="text-align: center;">';
    rowsHtml += '<button class="btn btn-secondary" style="padding: 4px 8px; margin-right: 4px;" onclick=\'editStudent(' + JSON.stringify(s) + ')\' title="Ubah">&#9998;</button>';
    rowsHtml += '<button class="btn btn-danger" style="padding: 4px 8px;" onclick="deleteStudent(\'' + s.idSiswa + '\')" title="Hapus">&times;</button>';
    rowsHtml += '</td>';
    rowsHtml += '</tr>';
  });
  tbody.innerHTML = rowsHtml;
  
  // Update Informasi Paginasi
  const start = ((data.page - 1) * data.limit) + 1;
  const end = Math.min(data.page * data.limit, data.total);
  document.getElementById('siswaPaginationInfo').textContent = 'Menampilkan ' + start + ' - ' + end + ' dari ' + data.total + ' siswa';
  
  // Render Tombol Halaman
  let btnsHtml = '';
  btnsHtml += '<button class="page-btn" ' + (data.page <= 1 ? 'disabled' : '') + ' onclick="fetchStudentsData(' + (data.page - 1) + ')">&laquo;</button>';
  for (let i = 1; i <= data.totalPages; i++) {
    if (i === 1 || i === data.totalPages || (i >= data.page - 1 && i <= data.page + 1)) {
      const activeClass = (i === data.page) ? ' active' : '';
      btnsHtml += '<button class="page-btn' + activeClass + '" onclick="fetchStudentsData(' + i + ')">' + i + '</button>';
    } else if (i === data.page - 2 || i === data.page + 2) {
      btnsHtml += '<span style="padding: 0 4px;">...</span>';
    }
  }
  btnsHtml += '<button class="page-btn" ' + (data.page >= data.totalPages ? 'disabled' : '') + ' onclick="fetchStudentsData(' + (data.page + 1) + ')">&raquo;</button>';
  document.getElementById('siswaPaginationBtns').innerHTML = btnsHtml;
}

function openSiswaModal() {
  document.getElementById('siswaModalTitle').textContent = 'Tambah Siswa Baru';
  document.getElementById('modalSiswaId').value = '';
  document.getElementById('modalSiswaNama').value = '';
  document.getElementById('modalSiswaNisn').value = '';
  document.getElementById('modalSiswaNis').value = '';
  document.getElementById('modalSiswaKelas').value = '';
  document.getElementById('modalSiswaJk').value = 'Laki-laki';
  document.getElementById('modalSiswaNoPeserta').value = '';
  document.getElementById('modalSiswaFoto').value = '';
  openModal('siswaModal');
}

function editStudent(student) {
  document.getElementById('siswaModalTitle').textContent = 'Ubah Data Siswa';
  document.getElementById('modalSiswaId').value = student.idSiswa;
  document.getElementById('modalSiswaNama').value = student.namaSiswa;
  document.getElementById('modalSiswaNisn').value = student.nisn || '';
  document.getElementById('modalSiswaNis').value = student.nis || '';
  document.getElementById('modalSiswaKelas').value = student.kelas;
  document.getElementById('modalSiswaJk').value = student.jenisKelamin || 'Laki-laki';

function executeImportSiswa() {
  const text = document.getElementById('importPasteArea').value.trim();
  if (!text) {
    showToast('Silakan tempelkan data siswa terlebih dahulu.', 'error');
    return;
  }
  
  const lines = text.split('\n');
  const students = [];
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    
    const parts = line.split('\t');
    if (parts.length >= 2) {
      students.push({
        nisn: parts[0] ? parts[0].trim() : '',
        nis: parts[1] ? parts[1].trim() : '',
        namaSiswa: parts[2] ? parts[2].trim() : parts[0].trim(),
        kelas: parts[3] ? parts[3].trim() : 'Umum',
        jenisKelamin: parts[4] ? parts[4].trim() : 'Laki-laki'
      });
    }
  }
  
  if (students.length === 0) {
    showToast('Format teks tidak dikenali. Pastikan memisahkan kolom dengan tombol Tab.', 'error');
    return;
  }
  
  callBackend('importStudents', { students: students }, function(res) {
    if (res && res.success) {
      closeModal('importModal');
      showToast(res.message, 'success');
      APP_STATE.cache.students = {};
      APP_STATE.cache.dashboard = null;
      fetchStudentsData(1);
    } else {
      showToast((res && res.message) ? res.message : 'Gagal mengimpor siswa.', 'error');
    }
  });
}

function updateRuangSelectOptions(rooms, sessions) {
  const rSelect = document.getElementById('filterRuangView');
  const sSelect = document.getElementById('filterSesiView');
  if (!rSelect || !sSelect) return;
  
  const curR = rSelect.value;
  let rHtml = '<option value="">Semua Ruang</option>';
  if (rooms && rooms.length) {
    rooms.forEach(function(r) {
      rHtml += '<option value="' + escapeHtml(r) + '"' + (r === curR ? ' selected' : '') + '>' + escapeHtml(r) + '</option>';
    });
  }
  rSelect.innerHTML = rHtml;
  
  const curS = sSelect.value;
  let sHtml = '<option value="">Semua Sesi</option>';
  if (sessions && sessions.length) {
    sessions.forEach(function(s) {
      sHtml += '<option value="' + escapeHtml(s) + '"' + (s === curS ? ' selected' : '') + '>' + escapeHtml(s) + '</option>';
    });
  }
  sSelect.innerHTML = sHtml;
}

  callBackend('getDataCetak', { jenis: jenis, ruang: ruang, sesi: sesi }, function(res) {
    if (res && res.success) {
      renderPrintDocument(res);
      setTimeout(function() {

    }
  });

function renderPrintDocument(data) {
  const container = document.getElementById('printContainer');
  container.innerHTML = generateDocumentHtml(data, false);
}

function generateDocumentHtml(data, isPreview = true) {
  try {
    const jenis = data.jenis;
    const set = data.settings || {};
    const items = data.items || [];
    const ruangName = (items[0] && items[0].namaRuang) ? items[0].namaRuang : (document.getElementById('cetakFilterRuang') && document.getElementById('cetakFilterRuang').value ? document.getElementById('cetakFilterRuang').value : 'Ruang 01');
    const sesiName = (items[0] && items[0].sesi) ? items[0].sesi : (document.getElementById('cetakFilterSesi') && document.getElementById('cetakFilterSesi').value ? document.getElementById('cetakFilterSesi').value : '1');
    
    if (!items || items.length === 0) {
      return '<div style="text-align:center; padding:40px; color:#64748b; font-size:13px;">Tidak ada data peserta/jadwal untuk kriteria cetak yang dipilih.</div>';
    }
    
    let html = '';

function handleExcelFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  document.getElementById('excelFileStatus').textContent = 'Membaca: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array', cellDates: true, cellNF: true, cellText: true });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
      
      if (!jsonData || jsonData.length <= 1) {
        showToast('File Excel kosong atau tidak memiliki baris data.', 'error');
        return;
      }
      
      const target = APP_STATE.excelTarget || 'siswa';
      const rows = [];
      
      for (let i = 1; i < jsonData.length; i++) {
        const r = jsonData[i];
        if (!r || r.length === 0) continue;
        
        if (target === 'siswa') {
          if (r[0] || r[2]) {
            let rawNisn = r[0] ? String(r[0]).trim() : '';
            // Proteksi angka 0 di depan NISN agar tidak hilang (standar 10 digit Kemdikbud)
            if (rawNisn && /^\d+$/.test(rawNisn) && rawNisn.length < 10) {
              rawNisn = rawNisn.padStart(10, '0');
            }
            let rawNis = r[1] ? String(r[1]).trim() : '';
            
            rows.push({
              nisn: rawNisn,
              nis: rawNis,
              namaSiswa: r[2] ? String(r[2]).trim() : (rawNisn ? rawNisn : 'Siswa'),
              kelas: r[3] ? String(r[3]).trim() : 'Umum',
              jenisKelamin: r[4] ? String(r[4]).trim() : 'Laki-laki'
            });
          }
        } else if (target === 'panitia') {
          if (r[0] || r[1]) {
            rows.push({
              nip: r[0] ? String(r[0]).trim() : '',
              namaPanitia: r[1] ? String(r[1]).trim() : 'Panitia',
              jabatan: r[2] ? String(r[2]).trim() : 'Anggota',
              noHp: r[3] ? String(r[3]).trim() : ''
            });
          }
        } else if (target === 'pengawas') {
          if (r[0] || r[1]) {
            rows.push({
              nip: r[0] ? String(r[0]).trim() : '',
              namaPengawas: r[1] ? String(r[1]).trim() : 'Pengawas',
              asalSekolah: r[2] ? String(r[2]).trim() : '',
              ruangTugas: r[3] ? String(r[3]).trim() : '',
              sesiTugas: r[4] ? String(r[4]).trim() : ''
            });
          }
        }
      }
      
      APP_STATE.parsedExcelData = rows;
      
      document.getElementById('excelPreviewCount').textContent = 'Berhasil membaca ' + rows.length + ' baris data siap diimpor:';
      let tableHtml = '<thead><tr>';
      if (target === 'siswa') tableHtml += '<th>NISN</th><th>NIS</th><th>Nama Siswa</th><th>Kelas</th><th>JK</th>';
      else if (target === 'panitia') tableHtml += '<th>NIP</th><th>Nama Panitia</th><th>Jabatan</th><th>No HP</th>';
      else if (target === 'pengawas') tableHtml += '<th>NIP</th><th>Nama Pengawas</th><th>Asal Sekolah</th><th>Ruang</th><th>Sesi</th>';
      tableHtml += '</tr></thead><tbody>';
      
      const samplePreview = rows.slice(0, 5);
      samplePreview.forEach(function(item) {
        tableHtml += '<tr>';
        if (target === 'siswa') {
          tableHtml += '<td>' + escapeHtml(item.nisn) + '</td><td>' + escapeHtml(item.nis) + '</td><td>' + escapeHtml(item.namaSiswa) + '</td><td>' + escapeHtml(item.kelas) + '</td><td>' + escapeHtml(item.jenisKelamin) + '</td>';
        } else if (target === 'panitia') {
          tableHtml += '<td>' + escapeHtml(item.nip) + '</td><td>' + escapeHtml(item.namaPanitia) + '</td><td>' + escapeHtml(item.jabatan) + '</td><td>' + escapeHtml(item.noHp) + '</td>';
        } else if (target === 'pengawas') {
          tableHtml += '<td>' + escapeHtml(item.nip) + '</td><td>' + escapeHtml(item.namaPengawas) + '</td><td>' + escapeHtml(item.asalSekolah) + '</td><td>' + escapeHtml(item.ruangTugas) + '</td><td>' + escapeHtml(item.sesiTugas) + '</td>';
        }
        tableHtml += '</tr>';
      });
      if (rows.length > 5) {
        tableHtml += '<tr><td colspan="5" style="text-align:center; color:#64748b;">... dan ' + (rows.length - 5) + ' baris data lainnya ...</td></tr>';
      }
      tableHtml += '</tbody>';
      
      document.getElementById('excelPreviewTable').innerHTML = tableHtml;
      document.getElementById('excelPreviewSection').style.display = 'block';
      document.getElementById('btnExecuteExcelImport').disabled = (rows.length === 0);
    } catch (err) {
      showToast('Gagal memproses file Excel: ' + err.toString(), 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function executeExcelImport() {
  const target = APP_STATE.excelTarget || 'siswa';
  const data = APP_STATE.parsedExcelData;
  if (!data || data.length === 0) {
    showToast('Tidak ada data Excel untuk diimpor.', 'error');
    return;
  }
  
  const btn = document.getElementById('btnExecuteExcelImport');
  btn.disabled = true;
  btn.textContent = 'Mengimpor ' + data.length + ' data...';
  
  let action = 'importStudents';
  let payload = { students: data };
  if (target === 'panitia') {
    action = 'importPanitia';
    payload = { panitia: data };
  } else if (target === 'pengawas') {
    action = 'importPengawas';
    payload = { pengawas: data };
  }
  
  callBackend(action, payload, function(res) {
    btn.disabled = false;
    btn.textContent = 'Mulai Import Data';
    if (res && res.success) {
      closeModal('excelImportModal');
      showToast(res.message, 'success');
      if (target === 'siswa') {
        APP_STATE.cache.students = {};
        APP_STATE.cache.dashboard = null;
        fetchStudentsData(1);
      } else if (target === 'panitia') {
        APP_STATE.cache.panitia = null;
        APP_STATE.cache.dashboard = null;
        loadPanitiaData();
      } else if (target === 'pengawas') {
        APP_STATE.cache.pengawas = null;
        APP_STATE.cache.dashboard = null;
        loadPengawasData();
      }
    } else {
      showToast((res && res.message) ? res.message : 'Import gagal.', 'error');
    }
  });
}

// ==============================================================================
// 11. SISTEM KOMUNIKASI BACKEND (CALL BRIDGE) & TOAST ALERT
// ==============================================================================
function callBackend(action, payload, callback) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (callback) callback(response);
      })
      .withFailureHandler(function(err) {
        showToast('Koneksi server gagal: ' + err.toString(), 'error');
        if (callback) callback({ success: false, message: err.toString() });
      })
      .apiRouter(action, payload);
  } else {
    // Mode Simulasi / Preview Lokal Offline
    console.warn('Google Script Run tidak terdeteksi. Simulasi lokal aktif.');
    setTimeout(function() {
      if (callback) callback({ success: true, message: 'Simulasi lokal' });
    }, 400);
  }
}

function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  toast.textContent = message;
  
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    setTimeout(function() {
      if (container.contains(toast)) container.removeChild(toast);
    }, 300);
  }, 4000);
}

function openModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.add('active');
}

function closeModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.remove('active');
}

function formatLh3(url) {
  if (!url) return 'https://lh3.googleusercontent.com/d/1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k';
  if (url.indexOf('lh3.googleusercontent.com/d/') !== -1) return url;
  
  const match1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (match1 && match1[1]) return 'https://lh3.googleusercontent.com/d/' + match1[1];
  
  const match2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (match2 && match2[1]) return 'https://lh3.googleusercontent.com/d/' + match2[1];
  
  return url;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
